<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Palette" subtitle="Parchment, Ivory, Ink, Sacred Gold, Void" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F4ECD8; font-family: 'EB Garamond', serif; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; }
  .swatch-color { height: 80px; border: 1px solid #C9A14A44; }
  .swatch-info { padding: 8px 0 0; }
  .swatch-name { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #1A1614; }
  .swatch-hex { font-family: 'EB Garamond', serif; font-size: 12px; color: #7A6E65; margin-top: 2px; }
  .swatch-role { font-family: 'EB Garamond', serif; font-size: 11px; color: #7A6E65; font-style: italic; margin-top: 2px; }
  .section-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9A14A; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="section-label">✦ Base Palette</div>
<div class="grid">
  <div class="swatch">
    <div class="swatch-color" style="background:#F4ECD8;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Parchment</div>
      <div class="swatch-hex">#F4ECD8</div>
      <div class="swatch-role">Primary BG</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#E8DFC4; border-color:#C9A14A55;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Ivory</div>
      <div class="swatch-hex">#E8DFC4</div>
      <div class="swatch-role">Secondary Surface</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1A1614;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Ink</div>
      <div class="swatch-hex">#1A1614</div>
      <div class="swatch-role">Primary Text</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#C9A14A;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Sacred Gold</div>
      <div class="swatch-hex">#C9A14A</div>
      <div class="swatch-role">Metatron / Law</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#0B0A0F;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Void</div>
      <div class="swatch-hex">#0B0A0F</div>
      <div class="swatch-role">Metatron Core</div>
    </div>
  </div>
</div>
</body>
</html>
