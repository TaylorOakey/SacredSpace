<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Element Palette" subtitle="Fire · Water · Earth · Air — full, text, dim variants" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F4ECD8; font-family: 'EB Garamond', serif; padding: 24px; }
  .elements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .element { border: 1px solid #C9A14A55; }
  .element-header { height: 90px; display: flex; align-items: center; justify-content: center; }
  .element-glyph { font-size: 36px; color: #F4ECD8; opacity: 0.9; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .element-body { padding: 12px; background: #F4ECD8; }
  .element-name { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #1A1614; }
  .element-hex { font-family: 'EB Garamond', serif; font-size: 12px; color: #7A6E65; margin-top: 3px; }
  .element-tints { display: flex; gap: 4px; margin-top: 8px; }
  .tint { height: 18px; flex: 1; border: 1px solid #C9A14A22; }
  .tint-label { font-family: 'EB Garamond', serif; font-size: 10px; color: #7A6E65; text-align: center; margin-top: 3px; }
  .section-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #C9A14A; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="section-label">✦ Element Palette</div>
<div class="elements">
  <div class="element">
    <div class="element-header" style="background:#B7472A;">
      <span class="element-glyph">△</span>
    </div>
    <div class="element-body">
      <div class="element-name">Fire</div>
      <div class="element-hex">#B7472A — Vermillion</div>
      <div class="element-tints">
        <div>
          <div class="tint" style="background:#B7472A;"></div>
          <div class="tint-label">Full</div>
        </div>
        <div>
          <div class="tint" style="background:#8C321B;"></div>
          <div class="tint-label">Text</div>
        </div>
        <div>
          <div class="tint" style="background:#B7472A22;"></div>
          <div class="tint-label">Dim</div>
        </div>
      </div>
    </div>
  </div>
  <div class="element">
    <div class="element-header" style="background:#2E5C7E;">
      <span class="element-glyph">▽</span>
    </div>
    <div class="element-body">
      <div class="element-name">Water</div>
      <div class="element-hex">#2E5C7E — Lapis</div>
      <div class="element-tints">
        <div>
          <div class="tint" style="background:#2E5C7E;"></div>
          <div class="tint-label">Full</div>
        </div>
        <div>
          <div class="tint" style="background:#1E4060;"></div>
          <div class="tint-label">Text</div>
        </div>
        <div>
          <div class="tint" style="background:#2E5C7E22;"></div>
          <div class="tint-label">Dim</div>
        </div>
      </div>
    </div>
  </div>
  <div class="element">
    <div class="element-header" style="background:#5C6E3C;">
      <span class="element-glyph">⊕</span>
    </div>
    <div class="element-body">
      <div class="element-name">Earth</div>
      <div class="element-hex">#5C6E3C — Verdant</div>
      <div class="element-tints">
        <div>
          <div class="tint" style="background:#5C6E3C;"></div>
          <div class="tint-label">Full</div>
        </div>
        <div>
          <div class="tint" style="background:#3D4A28;"></div>
          <div class="tint-label">Text</div>
        </div>
        <div>
          <div class="tint" style="background:#5C6E3C22;"></div>
          <div class="tint-label">Dim</div>
        </div>
      </div>
    </div>
  </div>
  <div class="element">
    <div class="element-header" style="background:#B8A7C9;">
      <span class="element-glyph" style="color:#1A1614; opacity:0.6;">◯</span>
    </div>
    <div class="element-body">
      <div class="element-name">Air</div>
      <div class="element-hex">#B8A7C9 — Smoky Violet</div>
      <div class="element-tints">
        <div>
          <div class="tint" style="background:#B8A7C9;"></div>
          <div class="tint-label">Full</div>
        </div>
        <div>
          <div class="tint" style="background:#6B5C80;"></div>
          <div class="tint-label">Text</div>
        </div>
        <div>
          <div class="tint" style="background:#B8A7C922;"></div>
          <div class="tint-label">Dim</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
