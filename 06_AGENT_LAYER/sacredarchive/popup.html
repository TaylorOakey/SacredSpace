<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S∆CR3D ∆RCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 380px; min-height: 520px; max-height: 600px; overflow: hidden; display: flex; flex-direction: column; }
  .results-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .sa-search-wrap { padding: 12px 18px; }
  .search-inner { position: relative; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(127,255,212,0.35); font-size: 12px; }
</style>
</head>
<body>
<div class="sa-header">
  <div class="sa-wordmark">
    <span class="glyph">∆</span>RCHIVE
    <span class="sigil">S∆CR3DSP∆CE · 06</span>
  </div>
  <div class="sa-badge" id="status-badge" data-tip="Vault connected">◈</div>
</div>
<div class="sa-search-wrap">
  <div class="search-inner">
    <span class="search-icon">✦</span>
    <input class="sa-search" id="sa-query" type="text" placeholder="Search vault… (Cmd+K)" autocomplete="off" spellcheck="false">
  </div>
</div>
<div class="results-scroll" id="results-container">
  <div class="sa-empty" id="empty-state">
    <span class="glyph">◇</span>
    <p>The vault awaits your query.</p>
  </div>
</div>
<div class="sa-status">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="dot"></div>
    <span id="status-text">Vault online</span>
  </div>
  <a href="options.html" target="_blank" style="color:var(--gold);opacity:0.5;font-size:10px;text-decoration:none;letter-spacing:0.15em;" title="Configure">⚙</a>
</div>
<script src="popup.js"></script>
</body>
</html>
